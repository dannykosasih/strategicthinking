.navbtn.active{background:var(--light);border-left-color:var(--teal);font-weight:600}
.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:var(--mid)}.dot.done{background:var(--good)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--mid);padding:10px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.warnbar{padding:6px 18px;font-size:12px;background:#fff8ec;color:#8a5a18;border-bottom:1px solid var(--mid)}
.content{flex:1;display:flex;min-height:0}.scroll{flex:1;overflow-y:auto;padding:18px;min-width:0}
.card{background:#fff;border:1px solid var(--mid);border-radius:12px;margin-bottom:18px}
.cardhead{padding:14px 18px 6px}.cardhead h3{font-size:16px;margin:0;color:var(--navy)}.cardhead p{font-size:12px;margin:2px 0 0;color:var(--blue)}
.cardbody{padding:0 18px 18px}
label.fld{display:block;margin-bottom:12px}label.fld span{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--navy)}
input,textarea,select{width:100%;border:1px solid var(--mid);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--soft)}
.row{display:flex;gap:8px;margin-bottom:6px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{border-radius:6px;font-weight:600;font-size:13px;padding:7px 12px;cursor:pointer;border:1px solid}
.btn.sm{font-size:12px;padding:4px 8px}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.teal{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.amber{background:var(--amber);color:#3a2c00;border-color:var(--amber)}
.btn.ghost{background:#fff;color:var(--primary);border-color:var(--mid)}
.btn.danger{background:#fff;color:var(--err);border-color:#e0a0a8}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:4px 6px;text-align:left;vertical-align:top}th{color:var(--navy);font-size:12px}
.synth{margin-top:8px;border-radius:12px;padding:16px;background:var(--light);border:1px solid var(--soft)}
.synth label{display:block;font-size:14px;font-weight:600;margin-bottom:4px;color:var(--navy)}
.pill{display:inline-block;margin-top:8px;font-size:12px;padding:2px 10px;border-radius:999px}
.drawer{width:300px;flex-shrink:0;background:#fff;border-left:1px solid var(--mid);overflow-y:auto;padding:16px}
.issue{font-size:12px;border-radius:6px;padding:8px;display:flex;gap:8px;margin-bottom:8px}
.small{font-size:11px;color:var(--blue)}.flex1{flex:1}
@media(max-width:780px){.rail{display:none}.grid2,.grid3{grid-template-columns:1fr}.drawer{display:none}}

function computeHHI(sh){var sum=0,hh=0;sh.forEach(function(s){var v=Number(s.share)||0;sum+=v;hh+=Math.pow(v/100,2);});return{hhi:hh,sum:sum,cls:hh<0.15?"rendah":hh<=0.25?"sedang":"tinggi"};}
function vrioOut(r){if(!r.v)return"Kelemahan";if(!r.r)return"Paritas";if(!r.i)return"Keunggulan sementara";if(!r.o)return"Keunggulan tak termanfaatkan";return"Keunggulan berkelanjutan";}
function bcgQ(u){var g=Number(u.growth)>=10,s=Number(u.relShare)>=1;if(g&&s)return{q:"Star",p:"Investasi pertahankan"};if(g&&!s)return{q:"Question Mark",p:"Danai selektif / keluar"};if(!g&&s)return{q:"Cash Cow",p:"Panen, danai lainnya"};return{q:"Dog",p:"Divestasi / reposisi"};}

function critique(s){
var out=[];function add(sev,w,t){out.push({sev:sev,weight:w,text:t});}
var H=computeHHI(s.shares);
if(Math.abs(H.sum-100)>5)add("warn",50,"Total pangsa pasar "+H.sum.toFixed(0)+"%, bukan ~100%.");
var hi=s.forces.filter(function(f){return Number(f.score)>=4;}).length;
var v=(s.forcesVerdict||"").toLowerCase();
if(hi>=3&&/(menarik|menguntungkan)/.test(v)&&!/tidak menarik|kurang menarik/.test(v))add("err",80,'Verdik Five Forces "menarik" padahal '+hi+' kekuatan bertekanan tinggi (≥4).');
var initText=(s.house.initiatives.join(" ")+" "+s.allocation).toLowerCase();
s.bcgUnits.forEach(function(u){if(bcgQ(u).q==="Star"){var n=(u.name||"").toLowerCase();if(n&&initText.indexOf(n.split(" ")[0])<0)add("warn",55,'BCG Star "'+u.name+'" tak punya inisiatif terdanai yang jelas.');}});
s.vrio.forEach(function(r){if(vrioOut(r)==="Keunggulan berkelanjutan"&&!r.resource.trim())add("err",70,"Klaim VRIO 'berkelanjutan' tanpa sumber daya disebut.");});
var g=(s.generic||"").toLowerCase();
if(g.indexOf("biaya")>=0&&s.vrio.some(function(r){return vrioOut(r).indexOf("berkelanjutan")>=0;}))add("warn",60,"Kepemimpinan Biaya dipilih padahal ada aset diferensiasi. Risiko stuck-in-the-middle.");
["now","future"].forEach(function(k){var tot=["h1","h2","h3"].reduce(function(a,x){return a+(Number(s.horizons[x][k])||0);},0);if(Math.abs(tot-100)>5)add("warn",40,"3 Horizons ("+(k==="now"?"kini":"depan")+") = "+tot+"%, bukan ~100%.");});
if(s.meta.vision&&s.bsc.length){var vw=(s.meta.vision.toLowerCase().match(/[a-z]{5,}/g)||[]);var bt=s.bsc.map(function(b){return b.objective+" "+b.kpi;}).join(" ").toLowerCase();if(vw.length&&!vw.some(function(w){return bt.indexOf(w)>=0;}))add("warn",50,"Visi ↔ Scorecard: tak ada tema visi di KPI manapun.");}
if(["so","st","wo","wt"].filter(function(k){return(s.tows[k]||"").trim();}).length===0)add("info",30,"TOWS kosong — SWOT belum jadi aksi.");
var fH3=Number(s.horizons.h3.future)||0;
if(fH3>=20&&!s.bcgUnits.some(function(u){return["Star","Question Mark"].indexOf(bcgQ(u).q)>=0;}))add("warn",45,"H3 ditarget "+fH3+"% tapi tak ada Star/Question Mark penopangnya.");
if(s.ansoff==="diversification"&&s.meta.level==="bu")add("warn",40,"Diversifikasi Ansoff di level Unit Bisnis — biasanya keputusan korporat.");
if(s.ansoff==="diversification"&&g.indexOf("fokus")>=0)add("warn",50,"Diversifikasi bertabrakan dengan strategi Fokus.");
var bold=s.blueOcean.factors.filter(function(f){return f.action==="create"||f.action==="eliminate";}).length;
if(!bold&&s.blueOcean.factors.some(function(f){return f.factor.trim();}))add("info",35,"Blue Ocean: tanpa Create/Eliminate = bersaing lebih keras, bukan samudra biru.");
if(Object.keys(s.bmc).some(function(k){return(s.bmc[k]||"").trim();})&&!(s.bmc.value||"").trim())add("warn",45,"BMC terisi tapi Proposisi Nilai kosong.");
s.stakeholders.forEach(function(st){if(Number(st.power)>=7&&st.stance==="resist")add("err",65,'"'+(st.name||"(tanpa nama)")+'" berkuasa tinggi & menolak — kelola erat atau strategi macet.');});
var quads=Object.keys(s.scenarios.quad).filter(function(k){return(s.scenarios.quad[k].implication||"").trim();}).length;
if(quads>0&&quads<4)add("info",25,"Skenario: baru "+quads+"/4 kuadran punya implikasi.");
var f7=SEVENS.filter(function(p){return(s.sevenS[p[0]]||"").trim();}).length;
if(f7>=4&&!(s.sevenS.sharedValues||"").trim())add("warn",48,"7S: elemen lain terisi tapi Shared Values kosong — 7S runtuh tanpa pusatnya.");
if(f7>0&&f7<7)add("info",24,"7S: baru "+f7+"/7 terisi. Ketidakselarasan bersembunyi di elemen kosong.");
if(Number(s.bowman)>=6)add("err",68,"Bowman posisi "+s.bowman+" ("+BOWMAN[s.bowman-1].label+") — tidak kompetitif berkelanjutan.");
if(Number(s.bowman)<=2&&g.indexOf("diferensiasi")>=0)add("warn",52,"Posisi Bowman harga-rendah bertabrakan dengan Diferensiasi.");
STAGES.forEach(function(st,i){if(!(s.syntheses[i]||"").trim())add("info",20,'Tahap '+i+' ("'+st+'") belum punya sintesis.');});
s.pestel.forEach(function(p){if(p.impact==="H"&&p.tag==="assumption")add("info",22,'PESTEL dampak tinggi "'+p.factor+'" masih asumsi tanpa sumber.');});
var rank={err:0,warn:1,info:2};out.sort(function(a,b){return rank[a.sev]-rank[b.sev]||b.weight-a.weight;});return out;}

function reducer(state,a){var n;switch(a.type){
case"LOAD":return a.payload;
case"SET":n=structuredClone(state);var ref=n;for(var i=0;i<a.path.length-1;i++)ref=ref[a.path[i]];ref[a.path[a.path.length-1]]=a.value;return n;
case"ARR":n=structuredClone(state);n[a.key][a.index][a.field]=a.value;return n;
case"ADD":n=structuredClone(state);n[a.key].push(structuredClone(a.row));return n;
case"DEL":n=structuredClone(state);n[a.key].splice(a.index,1);return n;
case"SYN":n=structuredClone(state);n.syntheses[a.stage]=a.value;return n;
default:return state;}}
